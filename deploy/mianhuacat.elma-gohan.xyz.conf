server {
    listen 80;
    listen [::]:80;
    server_name mianhuacat.elma-gohan.xyz;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://mianhuacat.elma-gohan.xyz$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mianhuacat.elma-gohan.xyz;
    ssl_certificate /etc/letsencrypt/live/mianhuacat.elma-gohan.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mianhuacat.elma-gohan.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/mianqiu-cathub/current;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = / {
        rewrite ^ /index.html break;
    }

    location ^~ /static/ {
        expires 1h;
    }
    location ^~ /data/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        expires 5m;
    }
    location ^~ /images/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "public, immutable";
        expires 30d;
    }

    location ^~ /api/v1/bot/ {
        proxy_pass http://127.0.0.1:8093;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    location ^~ /api/stats/ {
        proxy_pass http://127.0.0.1:8093;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    location / {
        return 404;
    }
}
