# HTTP only until DNS exists; then run:
#   certbot certonly --webroot -w /var/www/certbot -d mianhuacat.elma-gohan.xyz
# and replace the "location /" redirect block per other vhosts (see 4dgs.elma-gohan.xyz.conf).
server {
    listen 80;
    listen [::]:80;
    server_name mianhuacat.elma-gohan.xyz;

    root /opt/mianqiu-cathub/current;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = / {
        rewrite ^ /index.html break;
    }

    location ^~ /static/ {
        expires 1h;
    }
    location ^~ /data/ {
        add_header Access-Control-Allow-Origin "*" always;
        expires 5m;
    }
    location ^~ /images/ {
        add_header Access-Control-Allow-Origin "*" always;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /api/v1/bot/ {
        proxy_pass http://127.0.0.1:8093;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    location / {
        return 404;
    }
}
