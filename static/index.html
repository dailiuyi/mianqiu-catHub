<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ff9ccd">
  <link rel="icon" type="image/svg+xml" href="static/favicon.svg" id="favicon">
  <title>棉球小猫表情库 (棉花小猫) | mianqiu-catHub</title>
  <link rel="preload" href="static/fonts/zcool-kuaile-subset.woff2?v=cat-expressions-2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="static/style.css?v=home-legal-1">
  <!-- 引入 JSZip 用于客户端无服务器并发打包下载 -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" defer></script>
</head>
<body>
  <svg width="0" height="0" class="sr-only" aria-hidden="true">
    <symbol id="cat-face" viewBox="0 0 64 46">
      <path d="M8 44 C2 36 2 24 8 18 C9 10 13 4 18 4 C21 4 24 7 26 10 C30 9 34 9 38 10 C40 7 43 4 46 4 C51 4 55 10 56 18 C62 24 62 36 56 44 Z" fill="#fff" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
      <ellipse cx="15" cy="32" rx="6.5" ry="4.5" fill="#ffc8bd"/>
      <ellipse cx="49" cy="32" rx="6.5" ry="4.5" fill="#ffc8bd"/>
      <circle cx="24" cy="28" r="2.4" fill="currentColor"/>
      <circle cx="40" cy="28" r="2.4" fill="currentColor"/>
    </symbol>
  </svg>

  <!-- 顶部署名条 -->
  <header class="topbar">
    <a class="wordmark" href="./" aria-label="棉球小猫表情库首页">
      <svg class="wordmark-icon" aria-hidden="true"><use href="#cat-face"/></svg>
      <span>棉球小猫表情库</span>
    </a>
    <nav class="credits" aria-label="原作者与官方主页">
      <span>原作者 <b>쯔니 (zzni)</b></span>
      <a href="https://e.kakao.com/creator/69020H" target="_blank" rel="noopener">Kakao 商店</a>
      <a href="https://www.instagram.com/zz_ni_e" target="_blank" rel="noopener">Instagram</a>
    </nav>
  </header>

  <!-- 首屏：会动的小猫 + 搜索 -->
  <section class="hero">
    <h1 class="hero-title">今天发哪只棉球？</h1>
    <p class="hero-sub">
      收录 <b id="hero-total">…</b> 张棉花小猫表情。戳一下小猫，它会挑一张送你。
    </p>

    <div class="hero-cat" id="hero-cat"></div>

    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 L20 20"/></svg>
      <input type="search" id="search-input" placeholder="搜「贴贴」「早八」，拼音首字母 tt 也行" autocomplete="off" aria-label="搜索表情">
      <button type="button" id="search-clear" class="search-clear" aria-label="清空搜索" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7 L17 17 M17 7 L7 17"/></svg>
      </button>
    </div>

    <div class="tag-cloud" id="tag-cloud" aria-label="快捷搜索"></div>
  </section>

  <main class="library" id="library">
    <!-- 表情托盘：套系封面 + 筛选 -->
    <div class="drawer" id="drawer">
      <div class="series-tabs" id="series-tabs" role="group" aria-label="按套系筛选"></div>
      <div class="drawer-tools">
        <div class="segmented" id="type-filter" role="group" aria-label="动图或静图">
          <button type="button" class="seg-btn active" data-type="all" aria-pressed="true">全部</button>
          <button type="button" class="seg-btn" data-type="animated" aria-pressed="false">动图</button>
          <button type="button" class="seg-btn" data-type="static" aria-pressed="false">静图</button>
        </div>
        <div class="segmented" id="sort-filter" role="group" aria-label="排序">
          <button type="button" class="seg-btn active" data-sort="default" aria-pressed="true">原顺序</button>
          <button type="button" class="seg-btn" data-sort="random" aria-pressed="false">随机</button>
          <button type="button" class="seg-btn" data-sort="title" aria-pressed="false">按名称</button>
        </div>
        <button type="button" id="batch-mode-btn" class="chunky-btn" aria-pressed="false">批量选择</button>
      </div>
    </div>

    <p class="stats-line">
      <span id="stats-scope">全部套系</span>
      <span>已显示 <b id="displayed-count">0</b> / <b id="total-count">0</b> 张</span>
    </p>

    <!-- 表情网格 (触底无限加载，进入视口的动图才播放) -->
    <section class="meme-grid" id="meme-grid" aria-label="表情列表"></section>

    <div id="scroll-sentinel" class="scroll-sentinel">
      <span id="loading-text" role="status">正在获取表情库索引...</span>
    </div>
  </main>

  <!-- 小猫伙伴：首屏小猫滚出视口后跟到右下角，对鼠标停留的表情做反应 -->
  <div class="buddy" id="buddy"></div>

  <!-- 批量下载托盘 -->
  <div class="batch-tray" id="batch-tray" hidden>
    <span>已选 <b id="selected-count">0</b> 张</span>
    <div class="segmented" id="batch-format" role="group" aria-label="打包格式">
      <button type="button" class="seg-btn active" data-format="gif" aria-pressed="true">GIF</button>
      <button type="button" class="seg-btn" data-format="raw" aria-pressed="false">原图</button>
    </div>
    <button type="button" id="batch-select-all" class="chunky-btn" aria-pressed="false">全选</button>
    <button type="button" id="batch-download-btn" class="chunky-btn chunky-btn-primary" disabled>打包下载</button>
  </div>

  <!-- 大图弹窗 -->
  <dialog id="lightbox" class="sheet lightbox" aria-labelledby="lightbox-title">
    <button type="button" class="sheet-close" id="lightbox-close" aria-label="关闭">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7 L17 17 M17 7 L7 17"/></svg>
    </button>
    <div class="lightbox-stage">
      <img id="lightbox-img" alt="">
    </div>
    <div class="lightbox-info">
      <h2 id="lightbox-title"></h2>
      <p id="lightbox-title-ko" class="lightbox-ko" lang="ko"></p>
      <dl class="lightbox-meta">
        <dt>套系</dt><dd id="lightbox-series"></dd>
        <dt>尺寸</dt><dd id="lightbox-format"></dd>
      </dl>
      <div id="lightbox-tags" class="tag-list"></div>
      <div class="lightbox-actions">
        <a id="detail-page-btn" class="chunky-btn">网页详情</a>
        <button type="button" id="copy-img-btn" class="chunky-btn">复制图片</button>
        <button type="button" id="copy-link-btn" class="chunky-btn">复制链接</button>
        <a id="download-gif-btn" class="chunky-btn chunky-btn-primary" download>下载 GIF</a>
        <a id="download-btn" class="chunky-btn" download>下载原图</a>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <footer class="footer">
    <svg class="footer-cat" aria-hidden="true"><use href="#cat-face"/></svg>
    <div class="footer-main">
      <p class="footer-stats" id="footer-stats" hidden>
        <span id="footer-stats-line"></span>
        <span class="footer-since" id="footer-since"></span>
      </p>
      <p>非官方、非商业表情整理站，与原作者及 Kakao 无隶属或合作关系。原作署名 쯔니 (zzni)，素材权利归各自权利人所有。请支持正版。</p>
      <p><a href="static/disclaimer.html">版权与使用免责声明 · 权利投诉</a></p>
    </div>
  </footer>

  <script src="static/cat.js?v=cat-expressions-2"></script>
  <script src="static/app.js?v=home-legal-1"></script>
</body>
</html>
